name: SHIFT Flutter validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/shift-flutter-validation.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/shift-flutter-validation.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Widget and unit tests
        working-directory: mobile
        run: flutter test
