name: SHIFT Flutter verification

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inspect Flutter toolchain
        run: flutter --version
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze source
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Run tests
        working-directory: mobile
        run: flutter test --no-pub --reporter expanded
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [analyze-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build unsigned debug APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug --dart-define=SHIFT_BUILD_CHANNEL=qa
      - uses: actions/upload-artifact@v4
        with:
          name: shift-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
